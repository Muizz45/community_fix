
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NaijaFix</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<img src="../images/Flag.png" alt="Flag" class="nigeria-flag"
style="background-image: url('../images/Flag.png'); background-size: cover; background-position: center; filter: blur(1px); opacity: 0.7; position: absolute; width: 100px; height: auto; top: 25px; right: 25px;">
    <div class="login-container">

        <div class="login-header">
            <a href="../index.html" class="logo">Naija<span>Fix</span></a>
            <h2>Welcome Back!</h2>
            <p>Login to access your NaijaFix account.</p>
        </div>

        <form>
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required
            minlength="8">

            <button type="submit">Login</button>
        </form>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

        <a href="../index.html" class="back-home">Back to Homepage</a>

    </div>

</body>
</html>
