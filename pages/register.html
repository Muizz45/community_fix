
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NaijaFix</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="register-container">

        <div class="register-header">
            <a href="../index.html" class="logo">Naija<span>Fix</span></a>
            <h2>Create an Account</h2>
            <p>Join NaijaFix and help improve your community.</p>
        </div>

        <form>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" minlength="8" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Confirm your password">

            <button type="submit">Create Account</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <a href="../index.html" class="back-home">Back to Homepage</a>

    </div>

</body>
</html>
